<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub - Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #007bff;
      --secondary: #6c757d;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #ffc107;
      --info: #17a2b8;
      --light: #f8f9fa;
      --dark: #343a40;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #e3e8ef);
      color: #333;
      padding-bottom: 2rem;
    }
    
    .navbar {
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }
    
    .sidebar {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: sticky;
      top: 80px;
    }
    
    .main-content {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .card {
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      border: none;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0,0,0,.15);
    }
    
    .section-title {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 8px;
      margin-top: 20px;
      color: var(--dark);
      font-weight: 600;
    }
    
    .user-info {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 4px;
    }
    
    .timestamp {
      font-size: 12px;
      color: var(--secondary);
      margin-top: 4px;
    }
    
    .post {
      background: #f9fafc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #e0e0e0;
    }
    
    .comment-item {
      background: #e8f4fd;
      margin: 8px 0;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      border-left: 4px solid var(--primary);
    }
    
    .follow-info {
      background: #e8f5e8;
      padding: 8px;
      border-radius: 6px;
      margin: 5px 0;
      font-size: 13px;
    }
    
    .edit-form, .comment-form, .feedback-form {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: var(--secondary);
    }
    
    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
    }
    
    .success-msg {
      background: #d1edff;
      color: #155724;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
    }
    
    .navbar-brand {
      font-weight: 700;
    }
    
    .feature-icon {
      font-size: 1.5rem;
      margin-right: 10px;
    }
    
    .stat-item {
      background: #e9ecef;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      margin-right: 8px;
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 10px;
    }
    
    .post-image {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0;
      max-height: 500px;
      object-fit: cover;
    }
    
    .post-video {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0;
      max-height: 500px;
    }
    
    .action-btn {
      background: none;
      border: none;
      color: var(--secondary);
      font-size: 1.2rem;
      margin-right: 15px;
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .action-btn:hover {
      color: var(--primary);
    }
    
    .action-btn.liked {
      color: var(--danger);
    }
    
    .suggestion-card {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    
    .suggestion-card:last-child {
      border-bottom: none;
    }
    
    .suggestion-info {
      flex-grow: 1;
      margin-left: 10px;
    }
    
    .suggestion-username {
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .suggestion-fullname {
      color: var(--secondary);
      font-size: 0.8rem;
    }
    
    .btn-follow {
      font-size: 0.8rem;
      padding: 4px 12px;
    }
    
    .story-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding: 10px 0;
    }
    
    .story-item {
      flex: 0 0 auto;
      width: 70px;
      text-align: center;
    }
    
    .story-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
      padding: 2px;
      margin-bottom: 5px;
    }
    
    .story-avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--dark);
    }
    
    .story-username {
      font-size: 0.7rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .new-story {
      background: var(--primary);
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .media-preview-item {
      position: relative;
      margin-bottom: 10px;
    }

    .media-preview-item img,
    .media-preview-item video {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .remove-media-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(220, 53, 69, 0.9);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .upload-progress {
      height: 4px;
      background: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 5px;
    }

    .upload-progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .media-type-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }
  </style>
</head>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const api = "http://localhost:5000";
    let currentUser = null;
    let currentUsers = [];
    let posts = [];
    let selectedFiles = [];
    
    // Check if user is logged in
    function checkAuth() {
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = 'register.html';
        return false;
      }
      try {
        currentUser = JSON.parse(user);
        return true;
      } catch (e) {
        console.error('Error parsing user data:', e);
        window.location.href = 'register.html';
        return false;
      }
    }
    
    // Show message function
    function showMessage(message, type = 'success') {
      // Remove any existing messages first
      const existingAlerts = document.querySelectorAll('.alert');
      existingAlerts.forEach(alert => alert.remove());
      
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type === 'error' ? 'danger' : type} alert-dismissible fade show position-fixed`;
      alertDiv.style.top = '70px';
      alertDiv.style.right = '20px';
      alertDiv.style.zIndex = '1050';
      alertDiv.style.maxWidth = '300px';
      alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      `;
      
      document.body.appendChild(alertDiv);
      
      setTimeout(() => {
        if (alertDiv.parentNode) {
          alertDiv.remove();
        }
      }, 5000);
    }
    
    // Check server health
    async function checkServerHealth() {
      try {
        const response = await fetch(`${api}/health`);
        if (!response.ok) throw new Error('Server not responding');
        const data = await response.json();
        console.log('Server status:', data);
        return true;
      } catch (error) {
        console.error('Server health check failed:', error);
        showMessage('Server connection failed. Please make sure the backend server is running on port 5000.', 'error');
        return false;
      }
    }
    
    // Initialize user info in navbar and sidebar
    function initializeUserInfo() {
      if (!currentUser) return;
      
      // Set user avatar (first letter of username)
      const userInitial = currentUser.username ? currentUser.username.charAt(0).toUpperCase() : 'U';
      
      // Update navbar
      document.getElementById('navbarAvatar').textContent = userInitial;
      document.getElementById('navbarUsername').textContent = currentUser.username || 'User';
      
      // Update sidebar
      document.getElementById('sidebarAvatar').textContent = userInitial;
      document.getElementById('sidebarUsername').textContent = currentUser.username || 'Username';
      document.getElementById('sidebarFullname').textContent = currentUser.fullName || currentUser.email || 'Full Name';
      
      // Update modal
      document.getElementById('modalAvatar').textContent = userInitial;
      document.getElementById('modalUsername').textContent = currentUser.username || 'Username';
      
      // Update create post area
      document.getElementById('createPostAvatar').textContent = userInitial;
    }
    
    // Load users
    async function loadUsers() {
      try {
        console.log('Loading users...');
        const response = await fetch(`${api}/users`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const usersData = await response.json();
        console.log('Users loaded:', usersData.length);
        currentUsers = Array.isArray(usersData) ? usersData : [];
        
        // Load user stats
        await loadUserStats();
        
        // Load suggestions
        loadSuggestions();
        
        // Load stories
        await loadStories();
        
        // Load online friends
        loadOnlineFriends();
        
      } catch (error) {
        console.error('Error loading users:', error);
        showMessage('Failed to load users: ' + error.message, 'error');
        currentUsers = [];
      }
    }
    
    // Load user stats
    async function loadUserStats() {
      if (!currentUser) return;
      
      try {
        const userResponse = await fetch(`${api}/users/${currentUser.id}`);
        if (userResponse.ok) {
          const userData = await userResponse.json();
          document.getElementById('postsCount').textContent = userData.postsCount || 0;
          document.getElementById('followersCount').textContent = userData.followersCount || 0;
          document.getElementById('followingCount').textContent = userData.followingCount || 0;
        } else {
          // If specific user endpoint fails, calculate from general data
          const postsResponse = await fetch(`${api}/posts?userId=${currentUser.id}`);
          const followersResponse = await fetch(`${api}/followers/${currentUser.id}`);
          const followingResponse = await fetch(`${api}/following/${currentUser.id}`);
          
          const posts = postsResponse.ok ? await postsResponse.json() : [];
          const followers = followersResponse.ok ? await followersResponse.json() : [];
          const following = followingResponse.ok ? await followingResponse.json() : [];
          
          document.getElementById('postsCount').textContent = posts.length || 0;
          document.getElementById('followersCount').textContent = followers.length || 0;
          document.getElementById('followingCount').textContent = following.length || 0;
        }
        
      } catch (error) {
        console.error('Error loading user stats:', error);
        // Set default values
        document.getElementById('postsCount').textContent = '0';
        document.getElementById('followersCount').textContent = '0';
        document.getElementById('followingCount').textContent = '0';
      }
    }
    
    // Load suggestions
    async function loadSuggestions() {
      if (!currentUser || !currentUsers.length) {
        document.getElementById('suggestionsList').innerHTML = '<div class="text-muted">No suggestions available</div>';
        return;
      }
      
      try {
        // Get current user's following list
        let following = [];
        try {
          const followingResponse = await fetch(`${api}/following/${currentUser.id}`);
          if (followingResponse.ok) {
            following = await followingResponse.json();
          }
        } catch (e) {
          console.log('Could not load following list');
        }
        
        const followingIds = following.map(f => f.followedId);
        
        // Filter out current user and users already followed
        const suggestions = currentUsers.filter(user => 
          user.id !== currentUser.id && !followingIds.includes(user.id)
        ).slice(0, 5);
        
        if (suggestions.length === 0) {
          document.getElementById('suggestionsList').innerHTML = '<div class="text-muted">No suggestions available</div>';
          return;
        }
        
        const suggestionsHTML = suggestions.map(user => `
          <div class="suggestion-card">
            <div class="user-avatar">${user.username ? user.username.charAt(0).toUpperCase() : 'U'}</div>
            <div class="suggestion-info">
              <div class="suggestion-username">${user.username || 'Unknown User'}</div>
              <div class="suggestion-fullname">${user.fullName || user.email || ''}</div>
            </div>
            <button class="btn btn-primary btn-sm btn-follow" data-user-id="${user.id}">
              Follow
            </button>
          </div>
        `).join('');
        
        document.getElementById('suggestionsList').innerHTML = suggestionsHTML;
        
        // Add event listeners to follow buttons

      }

    // Check if user was recently active (within last 10 minutes)
    function isRecentlyActive(user) {
      if (!user.lastSeen) return false;
      try {
        const lastSeen = new Date(user.lastSeen);
        const tenMinutesAgo = new Date(Date.now() - 10 * 60 * 1000);
        return lastSeen > tenMinutesAgo;
      } catch (e) {
        return false;
      }
    }

    // Generate comments for a post
    function generateComments(post) {

        return '<div class="text-muted">No comments yet. Be the first to comment!</div>';
      }
      
      return post.comments.map(comment => `

          <div class="fw-bold">${comment.username || 'Unknown User'}</div>

          <small class="text-muted">${new Date(comment.createdAt).toLocaleDateString()}</small>
        </div>
      `).join('');
    }
    
    // Toggle like on a post
    async function toggleLike(postId, button) {
      try {
        const isCurrentlyLiked = button.classList.contains('liked');
        
        if (isCurrentlyLiked) {
          // Unlike the post
          const response = await fetch(`${api}/likes`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              userId: currentUser.id,
              targetId: postId,
              targetType: 'post'
            })
          });
          
          if (response.ok) {
            button.classList.remove('liked');
            showMessage('Post unliked');
            updateLikeCount(postId, -1);
          } else {
            throw new Error('Failed to unlike post');
          }
        } else {
          // Like the post
          const response = await fetch(`${api}/likes`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              userId: currentUser.id,
              targetId: postId,
              targetType: 'post'
            })
          });
          
          if (response.ok) {
            button.classList.add('liked');
            showMessage('Post liked!');
            updateLikeCount(postId, 1);
          } else {
            throw new Error('Failed to like post');
          }
        }
      } catch (error) {
        console.error('Error toggling like:', error);
        showMessage('Error updating like: ' + error.message, 'error');
      }
    }
    
    // Update like count display
    function updateLikeCount(postId, change) {
      const likeCountElement = document.querySelector(`#post-${postId} .fw-bold`);
      if (likeCountElement) {
        const currentText = likeCountElement.textContent;
        const currentCount = parseInt(currentText) || 0;
        const newCount = Math.max(0, currentCount + change);
        likeCountElement.textContent = `${newCount} likes`;
      }
    }
    
    // Toggle comments section
    async function toggleComments(postId) {
      const commentsSection = document.getElementById(`comments-${postId}`);
      const isVisible = commentsSection.style.display === 'block';
      
      if (!isVisible) {
        // Load comments if not already loaded
        await loadComments(postId);
      }
      
      commentsSection.style.display = isVisible ? 'none' : 'block';
    }
    
    // Load comments for a post
    async function loadComments(postId) {
      try {
        const response = await fetch(`${api}/comments/post/${postId}`);
        if (response.ok) {
          const comments = await response.json();
          const commentsList = document.getElementById(`comments-list-${postId}`);

                <div class="fw-bold">${comment.username || 'Unknown User'}</div>
                <div>${comment.content}</div>
                <small class="text-muted">${new Date(comment.createdAt).toLocaleDateString()}</small>
              </div>
            `).join('') || '<div class="text-muted">No comments yet. Be the first to comment!</div>';

    // Add comment to a post
    async function addComment(postId) {
      const commentInput = document.getElementById(`comment-input-${postId}`);
      const commentText = commentInput.value.trim();
      
      if (!commentText) {
        showMessage('Please enter a comment', 'error');
        return;
      }
      
      try {
        const response = await fetch(`${api}/comments`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },

            postId: postId,
            userId: currentUser.id,
            content: commentText
          })
        });
        
        if (response.ok) {

          commentInput.value = '';
          
          // Add the new comment to the list

          if (commentsList) {
            const commentHTML = `

                <small class="text-muted">Just now</small>

      } catch (error) {

        showMessage(error.message, 'error');

    // Handle media file selection
    function handleMediaSelection(files) {
      const mediaPreview = document.getElementById('mediaPreview');
      const mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
      
      if (!files || files.length === 0) {
        mediaPreview.style.display = 'none';
        selectedFiles = [];
        return;
      }
      
      // Clear previous previews
      mediaPreviewContainer.innerHTML = '';
      selectedFiles = Array.from(files);
      
      // Show preview for each file
      selectedFiles.forEach((file, index) => {
        const previewItem = document.createElement('div');
        previewItem.className = 'media-preview-item';
        
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-media-btn';
        removeBtn.innerHTML = '<i class="fas fa-times"></i>';
        removeBtn.onclick = () => removeMediaFile(index);
        
        const typeBadge = document.createElement('div');
        typeBadge.className = 'media-type-badge';
        typeBadge.textContent = file.type.startsWith('image/') ? 'IMAGE' : 'VIDEO';
        
        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          previewItem.appendChild(img);
        } else if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = URL.createObjectURL(file);
          video.controls = true;
          previewItem.appendChild(video);
        }
        
        previewItem.appendChild(removeBtn);
        previewItem.appendChild(typeBadge);
        mediaPreviewContainer.appendChild(previewItem);
      });
      
      mediaPreview.style.display = 'block';
    }
    
    // Remove media file from selection
    function removeMediaFile(index) {
      selectedFiles.splice(index, 1);
      const mediaUpload = document.getElementById('mediaUpload');
      
      // Update the file input
      const dt = new DataTransfer();
      selectedFiles.forEach(file => dt.items.add(file));
      mediaUpload.files = dt.files;
      
      // Refresh preview
      handleMediaSelection(selectedFiles);
    }
    
    // Create post with media upload
    async function createPost(content) {
      try {
        const visibility = document.getElementById('postVisibility').value;
        const mood = document.getElementById('postMood').value;
        const location = document.getElementById('postLocation').value;
        const hashtags = document.getElementById('postHashtags').value;
        const hasMedia = selectedFiles.length > 0;
        
        if (!content && !hasMedia) {
          showMessage('Please enter some content or add media for your post', 'error');
          return;
        }
        
        // Show upload progress
        const uploadProgress = document.getElementById('uploadProgress');
        const uploadProgressBar = document.getElementById('uploadProgressBar');
        uploadProgress.style.display = 'block';
        uploadProgressBar.style.width = '0%';
        
        // Create FormData for file upload
        const formData = new FormData();
        formData.append('userId', currentUser.id);
        formData.append('content', content || '');
        formData.append('visibility', visibility);
        
        if (mood) formData.append('mood', mood);
        if (location) formData.append('location', JSON.stringify({ name: location }));
        if (hashtags) formData.append('hashtags', hashtags);
        
        // Append media files
        selectedFiles.forEach(file => {
          formData.append('media', file);
        });
        
        // Simulate upload progress
        let progress = 0;
        const progressInterval = setInterval(() => {
          progress += 5;
          uploadProgressBar.style.width = `${progress}%`;
          if (progress >= 90) clearInterval(progressInterval);
        }, 100);
        
        const response = await fetch(`${api}/posts`, {
          method: 'POST',
          body: formData
        });
        
        clearInterval(progressInterval);
        uploadProgressBar.style.width = '100%';
        
        if (response.ok) {
          showMessage('Post created successfully!');
          resetPostForm();
          createPostModal.hide();
          await loadPosts();
          await loadUserStats();
        } else {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Failed to create post');
        }
      } catch (error) {
        console.error('Error creating post:', error);
        showMessage('Error creating post: ' + error.message, 'error');
      } finally {
        // Hide progress bar
        setTimeout(() => {
          const uploadProgress = document.getElementById('uploadProgress');
          if (uploadProgress) {
            uploadProgress.style.display = 'none';
          }
        }, 1000);
      }
    }

    // Add retry mechanism for failed requests
    async function fetchWithRetry(url, options = {}, retries = 3) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response;
      } catch (error) {
        if (retries > 0) {
          console.log(`Retrying request... ${retries} attempts left`);
          await new Promise(resolve => setTimeout(resolve, 1000));
          return fetchWithRetry(url, options, retries - 1);
        }
        throw error;
      }
    }

    // Enhanced fetch function with better error handling
    async function enhancedFetch(url, options = {}) {
      try {
        const response = await fetchWithRetry(url, options);
        return response;
      } catch (error) {
        console.error('Fetch failed:', error);
        throw new Error(`Network error: ${error.message}`);
      }
    }
