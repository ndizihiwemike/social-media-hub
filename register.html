<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub - Join Our Community</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #007bff;
      --secondary: #6c757d;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #ffc107;
      --info: #17a2b8;
      --light: #f8f9fa;
      --dark: #343a40;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #e3e8ef);
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .auth-container {
      max-width: 450px;
      width: 100%;
      padding: 0 15px;
    }
    
    .card {
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      border: none;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .card-header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 1.5rem;
    }
    
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
    }
    
    .btn-primary {
      background: var(--primary);
      border: none;
      padding: 0.75rem;
      font-weight: 600;
    }
    
    .btn-primary:hover {
      background: #0069d9;
    }
    
    .form-text {
      font-size: 0.875rem;
      color: var(--secondary);
    }
    
    .social-login {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    .social-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      color: var(--secondary);
      transition: all 0.2s;
    }
    
    .social-btn:hover {
      background: var(--light);
      color: var(--primary);
      transform: translateY(-2px);
    }
    
    .auth-switch {
      text-align: center;
      margin-top: 1.5rem;
    }
    
    .auth-switch a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .auth-switch a:hover {
      text-decoration: underline;
    }
    
    .alert {
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    
    .brand-logo {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: white;
    }
    
    .feature-icon {
      font-size: 1.2rem;
      margin-right: 0.5rem;
    }
    
    .features-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
    }
    
    .features-list li {
      padding: 0.5rem 0;
      color: var(--secondary);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="card">
      <div class="card-header">
        <div class="brand-logo">
          <i class="fas fa-users"></i>
        </div>
        <h2 class="mb-0">ConnectHub</h2>
        <p class="mb-0">Join our community today</p>
      </div>
      <div class="card-body p-4">
        <!-- Login Form -->
        <div id="loginForm">
          <h4 class="mb-4 text-center">Welcome Back</h4>
          <form id="loginFormElement">
            <div class="mb-3">
              <label for="loginUsername" class="form-label">Username</label>
              <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
          </form>
          
          <div class="social-login">
            <button class="social-btn" title="Login with Facebook">
              <i class="fab fa-facebook-f"></i>
            </button>
            <button class="social-btn" title="Login with Twitter">
              <i class="fab fa-twitter"></i>
            </button>
            <button class="social-btn" title="Login with Google">
              <i class="fab fa-google"></i>
            </button>
          </div>
          
          <div class="auth-switch">
            Don't have an account? <a href="#" id="showRegister">Sign up</a>
          </div>
        </div>
        
        <!-- Register Form -->
        <div id="registerForm" style="display: none;">
          <h4 class="mb-4 text-center">Create Account</h4>
          <form id="registerFormElement">
            <div class="mb-3">
              <label for="registerUsername" class="form-label">Username</label>
              <input type="text" class="form-control" id="registerUsername" placeholder="Choose a username" required>
              <div class="form-text">This will be your public username</div>
            </div>
            <div class="mb-3">
              <label for="registerEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="registerEmail" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label for="registerPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="registerPassword" placeholder="Create a password" required>
              <div class="form-text">Must be at least 6 characters</div>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="agreeTerms" required>
              <label class="form-check-label" for="agreeTerms">I agree to the Terms of Service and Privacy Policy</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
          </form>
          
          <div class="auth-switch">
            Already have an account? <a href="#" id="showLogin">Sign in</a>
          </div>
        </div>
      </div>
    </div>

      <div class="card-body">
        <h5 class="card-title">Why Join ConnectHub?</h5>
        <ul class="features-list">
          <li><i class="fas fa-check-circle text-success feature-icon"></i>Connect with friends and family</li>
          <li><i class="fas fa-check-circle text-success feature-icon"></i>Share photos and updates</li>
          <li><i class="fas fa-check-circle text-success feature-icon"></i>Discover new content and creators</li>
          <li><i class="fas fa-check-circle text-success feature-icon"></i>Express yourself with comments and likes</li>
        </ul>
      </div>
    </div>
  </div> -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const api = "http://localhost:5000";
    
    // Toggle between login and register forms
    document.getElementById('showRegister').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    });
    
    document.getElementById('showLogin').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    });
    
    // Show message function
    function showMessage(message, type = 'success') {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type === 'error' ? 'danger' : type} alert-dismissible fade show`;
      alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      `;
      
      document.querySelector('.card-body').prepend(alertDiv);
      
      setTimeout(() => {
        alertDiv.remove();
      }, 5000);
    }
    
    // Login form submission
    document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      
      try {
        // Check if user exists
        const response = await fetch(`${api}/users?username=${username}`);
        
        if (!response.ok) {
          throw new Error('Server error. Please try again later.');
        }
        
        const users = await response.json();
        
        if (users.length === 0) {
          showMessage('Invalid username or password', 'error');
          return;
        }
        
        const user = users[0];
        
        // In a real app, you would verify the password with the server
        // For this demo, we'll just check if a password was entered
        if (!password) {
          showMessage('Please enter your password', 'error');
          return;
        }
        
        // Store user info in localStorage
        localStorage.setItem('currentUser', JSON.stringify(user));
        
        // Redirect to dashboard
        window.location.href = 'index.html';
        
      } catch (error) {
        console.error('Login error:', error);
        showMessage(error.message || 'Login failed. Please try again.', 'error');
      }
    });
    
    // Register form submission
    document.getElementById('registerFormElement').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('registerUsername').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Validate passwords match
      if (password !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }
      
      try {
        // Create user
        const response = await fetch(`${api}/users`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password })
        });
        
        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Registration failed');
        }
        
        const newUser = await response.json();
        
        // Store user info in localStorage
        localStorage.setItem('currentUser', JSON.stringify(newUser));
        
        showMessage('Account created successfully! Redirecting to dashboard...', 'success');
        
        // Redirect to dashboard after a short delay
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
        
      } catch (error) {
        console.error('Registration error:', error);
        showMessage(error.message || 'Registration failed. Please try again.', 'error');
      }
    });
  </script>
</body>
</html>
